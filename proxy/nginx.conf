# Unified entry point for Villi — one origin for web + API.
# Use with ngrok: `ngrok http 8080` (or PROXY_HOST_PORT from .env).
#
#   /       → React storefront (web container)
#   /api/*  → NestJS API (api container)

server {
    listen 80;
    server_name _;

    # Docker embedded DNS — re-resolve upstreams when api/web containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;

    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
