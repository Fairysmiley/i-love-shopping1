# Unified entry point for Villi — one origin for web + API.
# Use with ngrok: `ngrok http 8080` (or PROXY_HOST_PORT from .env).
#
#   /          → React storefront (web container)
#   /api/*     → NestJS API (api container)
#   /uploads/* → NestJS API static file serving (admin-uploaded product images)

server {
    listen 80;
    server_name _;

    # Docker embedded DNS — re-resolve upstreams when api/web containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;

    location /api/ {
        set $api_upstream https://api:3001;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /uploads/ {
        set $api_upstream https://api:3001;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Mailhog inbox — so remote reviewers on a single ngrok tunnel (port 8080
    # only) can read password-reset emails without a second exposed port.
    location /mailhog/ {
        set $mailhog_upstream http://mailhog:8025;
        rewrite ^/mailhog/(.*) /$1 break;
        proxy_pass $mailhog_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
